<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTS Mobile 1</title>
    <!-- Memanggil file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mobile-container">
        
        <!-- ================= HALAMAN LOGIN ================= -->
        <div id="login-page" class="page active">
            <div class="header-text">
                <h2>MY APP</h2>
                <h3>UTS MOBILE 1</h3>
            </div>

            <div class="input-group">
                <input type="email" id="email" placeholder="INPUT EMAIL">
                <input type="password" id="password" placeholder="INPUT PASSWORD">
                <button id="btn-login">TOMBOL LOGIN</button>
            </div>
        </div>

        <!-- ================= HALAMAN HOME ================= -->
        <div id="home-page" class="page">
            <div class="home-title">HOME PAGE</div>

                        <!-- Kotak Profil -->
            <div class="profile-section">
                <!-- UBAH BAGIAN INI -->
                <img src="WhatsApp Image 2026-10-29 at 04.51.22.jpeg" alt="Foto Profil" class="photo-box">
                
                <div class="user-name" id="display-name">NAMA KAMU</div>
            </div>

            <!-- Menu Grid -->
            <div class="menu-grid">
                <div class="menu-item">lesley ke 60 jawa barat</div>
                <div class="menu-item">hobi 1: bantuin temen ke imo</div>
                <div class="menu-item">hobi 2: jeketian(peridolan ibukota)</div>
                <div class="menu-item">sabar</div>
            </div>

            <!-- Tombol Logout -->
            <button id="btn-logout">TOMBOL LOGOUT</button>
        </div>

    </div>

    <!-- Memanggil file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
